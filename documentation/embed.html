	<style>
    @font-face {
      font-family: Tofu;
      src: url("data:font/ttf;base64,AAEAAAAMAIAAAwBAQ09MUgAAAAAAAATEAAAADkNQQUwAAQAOAAAE1AAAAA5PUy8yXy9eUgAAAUgAAABgY21hcAAu/PYAAAGwAAAAZGdseWYziTUFAAACHAAAAZ5oZWFkK9bSnAAAAMwAAAA2aGhlYQiyCF8AAAEEAAAAJGhtdHgFVwAzAAABqAAAAAZsb2NhAM8AAAAAAhQAAAAGbWF4cAAHAI8AAAEoAAAAIG5hbWUOASU8AAADvAAAANxwb3N0cGx5dAAABJgAAAArAAEAAAABAACG3ugeXw889QADBAAAAAAA4+LHcAAAAADj4sdwAFz/CwSeA7YAAAAGAAIAAAAAAAAAAQAAA7b/BgAABPsAXABdBJ4EAAAAAAAAAAAAAAAAAAAAAAEAAQAAAAIAjgAEAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAEBPsBkAAFAAQCmgJmAAAATQKaAmYAAAFmADMBMwAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAABOT05FAMAAAAAgA7b/BgAAA7YA+gAAAAEAAAAAAgACzQAAACAAAAT7ADMAXAAAAAAAAwAAAAMAAAAcAAMAAQAAABwAAwAKAAAAPAAEACAAAAAEAAQAAQAAAAH//wAAAAH//wAAAAEAAAAAAA0AAAAAACgAAAAAAAAAAgAAAAIAAP4OAAAAAQAA/hAAEP//AAAAAQAAAAAAzwAAAAQAXP8LBJ4DtgAhAEYAdwCNAAATFBYXDgIXHgIXIT4CNzYmJic+AicuAichIg4CEyYmNTQ2NjMhMhYWFRQGBgceAhUUBgYjIS4CJyY2NjcmJiclNSIGBwYHBxcXNzY2NzY2MzIWFxYHFAcGBgcGBgcGBhUVMzU0Njc3NjY3NjU0JicmAzM2JicmBgcGBhUUFhcWFjMyNjc2Nlw3MzE1AxoZX3xGAZlGfF8ZGgM1MTE1AxoZX3xG/mdHe141ryouRHNHAZlHc0QvVDc4VjFFdEf+Z0FuSAkJKlo+HTIWAX4hLxIrDA4pKQgGDQkGFg0SFwoTAgsEFA4RGgYJBV8FBiQSHAgRGBcqDAIBFhISJg4KCQkKCRcMDBcJCgkCXEeDMTF+iEFBYjgDAzhiQUGIfjExfYlBQWI4AjZffv7yJWc4R3ZGRnZHOmZKERBKZjtHdkYBO2ZAQHVXEwgaFNgCDwwVKiAOEBsIDwQGBQgIEhoSDwgVDhEZDQwcDiQcChQIJhAeDiEgHy8VJv4gEyEHCAkPCBcMDRcICgkJCggXAAAAAAAGAE4AAwABBAkAAQAIAAAAAwABBAkAAgAOAAgAAwABBAkAAwAuABYAAwABBAkABAAYAEQAAwABBAkABQAaAFwAAwABBAkABgAYAHYAVABvAGYAdQBSAGUAZwB1AGwAYQByADEALgAwADAAMAA7AE4ATwBOAEUAOwBUAG8AZgB1AC0AUgBlAGcAdQBsAGEAcgBUAG8AZgB1ACAAUgBlAGcAdQBsAGEAcgBWAGUAcgBzAGkAbwBuACAAMQAuADAAMAAwAFQAbwBmAHUALQBSAGUAZwB1AGwAYQByAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAQIEdG9mdQAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAAAAAAAOAAAAAA==");

		:root {
			/*
			 * Opt into both light and dark schemes so the iframe's used color
			 * scheme can match a dark embedding page. Without this the document
			 * defaults to light, and Chromium paints an opaque white backdrop
			 * behind the transparent iframe when it's embedded in a dark-scheme
			 * page, defeating `background: transparent`.
			 */
			color-scheme: light dark;
			/* Primary text color, overridable via the `color` URL parameter. */
			--text-color: #1a1a1a;
			/* Text color used on inverted stages, overridable via the `invertColor` URL parameter. */
			--invert-text-color: #fff;
			/* Upper bounds for the enlarged preview and the individual grid cells. */
			--preview-max: 320px;
			--cell-max: 64px;
		}

		html,
		body {
			margin: 0;
			padding: 0;
			background: transparent;
		}

		body {
			font-family: InterVariable, "Gen Interface JP", system-ui, sans-serif;
			color: var(--text-color);
			-webkit-font-smoothing: antialiased;
			text-rendering: optimizeLegibility;
		}

		.content {
			padding: 1rem;
		}

		/* ---- Stage (inverts on demand) ---- */
		.stage {
			border: 1px solid color-mix(in srgb, var(--text-color) 15%, transparent);
			border-radius: 8px;
			padding: 1.25rem;
			color: var(--text-color);
			transition: background 0.15s ease;
		}

		.stage--invert {
			background: var(--text-color);
			border-color: transparent;
			color: var(--invert-text-color);
		}

		/* ---- Glyph preview ---- */
		/*
		 * Two columns: an enlarged preview on the left and the gojūon grid on
		 * the right. `align-items: start` lets the preview's `position: sticky`
		 * track the viewport while the taller grid column scrolls past it.
		 */
		.glyphs-grid {
			display: grid;
			/* Grid aims for ~half the viewport (capped at its natural 5-cell
			 * width); the preview takes whatever space is left. */
			grid-template-columns:
				minmax(0, 1fr)
				minmax(0, min(50vw, calc(5 * var(--cell-max) + 4 * 0.25rem)));
			gap: 2rem;
			align-items: start;
			/* preview (--preview-max) + gap (2rem) + grid (5 cells + 4 gaps) */
			max-width: calc(var(--preview-max) + 2rem + 5 * var(--cell-max) + 4 * 0.25rem);
			margin-inline: auto;
		}

		.glyph-preview {
			position: sticky;
			top: 1rem;
		}

		/* Square box, capped at `--preview-max`, that the canvas fills. */
		.glyph-preview__box {
			width: min(100%, var(--preview-max));
			aspect-ratio: 1;
		}

		.glyph-preview__canvas {
			display: block;
			width: 100%;
			height: 100%;
		}

		/* The same glyph rendered in the default font, as a caption. */
		.glyph-preview__label {
			width: min(100%, var(--preview-max));
			margin-top: 0.5rem;
			text-align: center;
			font-family: system-ui, sans-serif;
			font-size: 1.25rem;
			line-height: 1;
			color: var(--text-color);
			opacity: 0.7;
		}

		/* Five vowel columns; cells shrink with the column but never grow
		 * past `--cell-max`. */
		.glyph-grid {
			display: grid;
			grid-template-columns: repeat(5, minmax(0, 1fr));
			gap: 0.25rem;
			justify-content: start;
		}

		.glyph-cell {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 100%;
			max-width: var(--cell-max);
			aspect-ratio: 1;
			margin: 0;
			padding: 0;
			border: 1px solid color-mix(in srgb, var(--text-color) 12%, transparent);
			border-radius: 6px;
			background: transparent;
			color: var(--text-color);
			font-family: "Mìkam Kana", system-ui, sans-serif;
			line-height: 1;
			cursor: pointer;
			/* Establish a query container so the glyph can size with `cqi`. */
			container-type: inline-size;
			transition: background 0.12s ease, border-color 0.12s ease;
		}

		.glyph-cell__char {
			font-size: 58cqi;
		}

		.glyph-cell:hover {
			background: color-mix(in srgb, var(--text-color) 10%, transparent);
		}

		.glyph-cell[aria-pressed="true"] {
			border-color: color-mix(in srgb, var(--text-color) 60%, transparent);
			background: color-mix(in srgb, var(--text-color) 6%, transparent);
		}

		/* Placeholder cell that keeps the five-column vowel alignment intact. */
		.glyph-cell--empty {
			border-color: transparent;
			cursor: default;
			pointer-events: none;
		}

		/* ---- Tester ---- */
		.tester {
			display: flex;
			flex-direction: column;
			gap: 1.5rem;
			margin-top: 2.5rem;
		}

		.tester__controls {
			display: flex;
			flex-wrap: wrap;
			gap: 1.25rem;
			font-family: system-ui, sans-serif;
			font-size: 0.8rem;
			color: color-mix(in srgb, var(--text-color) 70%, transparent);
		}

		.tester__controls .ctl {
			display: flex;
			flex-direction: column;
			gap: 0.4rem;
		}

		/* Header row of a control: name, live value and optional reset. */
		.ctl__label {
			display: flex;
			align-items: center;
			gap: 0.4rem;
		}

		.ctl__value {
			color: var(--text-color);
			font-variant-numeric: tabular-nums;
		}

		.ctl__reset {
			margin-left: auto;
			height: 1.1rem;
			padding: 0 0.35rem;
			font-family: system-ui, sans-serif;
			font-size: 0.7rem;
			color: color-mix(in srgb, var(--text-color) 70%, transparent);
			background: transparent;
			border: 1px solid color-mix(in srgb, var(--text-color) 30%, transparent);
			border-radius: 3px;
			cursor: pointer;
		}

		.ctl__reset:hover {
			color: var(--text-color);
			border-color: color-mix(in srgb, var(--text-color) 60%, transparent);
		}

		/* Align every control's interactive row to the same height. */
		.tester__controls .ctl > .tester__toggle {
			display: flex;
			align-items: center;
			min-height: 1.75rem;
		}

		/* ---- Minimal range sliders ---- */
		.tester__controls input[type="range"] {
			-webkit-appearance: none;
			appearance: none;
			width: 100%;
			min-width: 8rem;
			height: 1.75rem;
			margin: 0;
			padding: 0;
			background: transparent;
			cursor: pointer;
		}

		.tester__controls input[type="range"]::-webkit-slider-runnable-track {
			height: 2px;
			border-radius: 2px;
			background: color-mix(in srgb, var(--text-color) 25%, transparent);
		}

		.tester__controls input[type="range"]::-moz-range-track {
			height: 2px;
			border-radius: 2px;
			background: color-mix(in srgb, var(--text-color) 25%, transparent);
		}

		.tester__controls input[type="range"]::-webkit-slider-thumb {
			-webkit-appearance: none;
			appearance: none;
			width: 12px;
			height: 12px;
			margin-top: -5px;
			border: none;
			border-radius: 50%;
			background: var(--text-color);
			transition: transform 0.1s ease;
		}

		.tester__controls input[type="range"]::-moz-range-thumb {
			width: 12px;
			height: 12px;
			border: none;
			border-radius: 50%;
			background: var(--text-color);
			transition: transform 0.1s ease;
		}

		.tester__controls input[type="range"]:hover::-webkit-slider-thumb {
			transform: scale(1.2);
		}

		.tester__controls input[type="range"]:hover::-moz-range-thumb {
			transform: scale(1.2);
		}

		.tester__controls input[type="range"]:focus-visible::-webkit-slider-thumb {
			box-shadow: 0 0 0 3px color-mix(in srgb, var(--text-color) 30%, transparent);
		}

		.tester__controls input[type="range"]:focus-visible::-moz-range-thumb {
			box-shadow: 0 0 0 3px color-mix(in srgb, var(--text-color) 30%, transparent);
		}

		/* ---- Toggle button groups ---- */
		.tester__toggle {
			display: flex;
			gap: 0.35rem;
		}

		.tester__toggle button {
			height: 1.75rem;
			padding: 0 0.6rem;
			font-family: system-ui, sans-serif;
			font-size: 0.8rem;
			color: color-mix(in srgb, var(--text-color) 70%, transparent);
			background: transparent;
			border: 1px solid color-mix(in srgb, var(--text-color) 40%, transparent);
			border-radius: 4px;
			cursor: pointer;
		}

		.tester__toggle button[aria-pressed="true"] {
			background: color-mix(in srgb, var(--text-color) 12%, transparent);
			color: var(--text-color);
			border-color: color-mix(in srgb, var(--text-color) 70%, transparent);
		}

		/* Font picker: each button previews 字 in the stack it selects. */
		.tester__toggle--font button {
			width: 2.5rem;
			padding: 0;
			font-size: 1.15rem;
			line-height: 1;
		}

		.tester__font--full {
			font-family: "Gen Interface JP", sans-serif;
		}

		.tester__font--tofu {
			font-family: Tofu, sans-serif;
		}

		.tester__toggle--icon button {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 2.5rem;
			padding: 0;
		}

		.tester__toggle--icon button svg {
			width: 1.1rem;
			height: 1.1rem;
		}

		/* ---- Stage + editable text ---- */
		.tester__stage {
			border: 1px solid color-mix(in srgb, var(--text-color) 15%, transparent);
			border-radius: 8px;
			transition: background 0.15s ease;
		}

		.tester__text {
			display: block;
			padding: 1.25rem;
			outline: none;
			color: var(--text-color);
			font-family: var(--test-font, "Mìkam Kana", InterVariable, "Gen Interface JP", system-ui, sans-serif);
			font-size: var(--size, 48px);
			line-height: var(--lh, 1.5);
			letter-spacing: var(--tracking, 0);
			text-align: var(--align, center);
			word-break: break-word;
		}

		.tester__stage--invert {
			background: var(--text-color);
			border-color: transparent;
		}

		.tester__stage--invert .tester__text {
			color: var(--invert-text-color);
		}

		/* Reference rendering of the same text, in a fixed size and a subtle
		 * color, using Inter + Gen Interface JP only (no Mìkam Kana). */
		.tester__label {
			padding: 0 1.25rem;
			font-family: InterVariable, "Gen Interface JP", system-ui, sans-serif;
			font-size: 1rem;
			line-height: 1.5;
			color: color-mix(in srgb, var(--text-color) 50%, transparent);
			text-align: var(--align, start);
			white-space: pre-wrap;
			word-break: break-word;
		}
	</style>
</head>
<body>
	<div class="content">
		<section class="glyphs-grid">
		</section>
		<section class="tester">
			<div class="tester__controls">

	<script>
		// ---- URL parameters: color + invert color ----
		(function () {
			"use strict";

			const params = new URLSearchParams(window.location.search);

			// Primary text color, e.g. ?color=e63946 or ?color=red
			const color = params.get("color");
			if (color) {
				const value = /^[0-9a-fA-F]{3,8}$/.test(color) ? "#" + color : color;
				document.documentElement.style.setProperty("--text-color", value);
			}

			// Text color on inverted stages, e.g. ?invertColor=e63946 or ?invertColor=black
			const invertColor = params.get("invertColor");
			if (invertColor) {
				const value = /^[0-9a-fA-F]{3,8}$/.test(invertColor) ? "#" + invertColor : invertColor;
				document.documentElement.style.setProperty("--invert-text-color", value);
			}
		})();

		// ---- Glyph preview ----
		// Renders an enlarged preview of one glyph beside a gojūon-ordered grid
		// of every glyph the font provides. Hovering a cell previews it; clicking
		// selects it. The hovered glyph always wins over the selected one.
		(function () {
			"use strict";

			const FONT = '"Mìkam Kana"';
			const section = document.querySelector(".glyphs-grid");
			if (!section) return;

			// ---- Build the static DOM scaffold ----
			const preview = document.createElement("div");
			preview.className = "glyph-preview";
			const box = document.createElement("div");
			box.className = "glyph-preview__box";
			const canvas = document.createElement("canvas");
			canvas.className = "glyph-preview__canvas";
			box.appendChild(canvas);
			preview.appendChild(box);
			const label = document.createElement("div");
			label.className = "glyph-preview__label";
			preview.appendChild(label);

			const gridEl = document.createElement("div");
			gridEl.className = "glyph-grid";

			section.appendChild(preview);
			section.appendChild(gridEl);

			// ---- Gojūon (五十音図) charts ----
			// Each group is one consonant row; its variant strings lay glyphs across
			// the five vowel columns (a/i/u/e/o). `_` marks a vowel slot with no
			// kana. A variant row with no available glyph is skipped when rendering.
			// Hiragana and katakana are listed explicitly because katakana carries
			// glyphs with no hiragana counterpart (the small phonetic kana ㇰ–ㇿ and
			// the bilabial ヷヸヹヺ).
			const VARIANTS = ["standard", "voiced", "semivoiced", "small", "smallPhonetic"];

			const HIRAGANA = [
				{ standard: "あいうえお", voiced: "__ゔ__", small: "ぁぃぅぇぉ" },
				{ standard: "かきくけこ", voiced: "がぎぐげご", small: "ゕ__ゖ_" },
				{ standard: "さしすせそ", voiced: "ざじずぜぞ" },
				{ standard: "たちつてと", voiced: "だぢづでど", small: "__っ__" },
				{ standard: "なにぬねの" },
				{ standard: "はひふへほ", voiced: "ばびぶべぼ", semivoiced: "ぱぴぷぺぽ" },
				{ standard: "まみむめも" },
				{ standard: "や_ゆ_よ", small: "ゃ_ゅ_ょ" },
				{ standard: "らりるれろ" },
				{ standard: "わゐ_ゑを", small: "ゎ____" },
				{ standard: "ん____" },
        { standard: "ゝゞ" },
			];

			const KATAKANA = [
				{ standard: "アイウエオ", voiced: "__ヴ__", small: "ァィゥェォ" },
				{ standard: "カキクケコ", voiced: "ガギグゲゴ", small: "ヵ_ㇰヶ_", },
				{ standard: "サシスセソ", voiced: "ザジズゼゾ", small: "_ㇱㇲ__" },
				{ standard: "タチツテト", voiced: "ダヂヅデド", small: "__ッ_ㇳ" },
				{ standard: "ナニヌネノ", small: "__ㇴ__" },
				{ standard: "ハヒフヘホ", voiced: "バビブベボ", semivoiced: "パピプペポ", small: "ㇵㇶㇷㇸㇹ" },
				{ standard: "マミムメモ", small: "__ㇺ__" },
				{ standard: "ヤ_ユ_ヨ", small: "ャ_ュ_ョ" },
				{ standard: "ラリルレロ", small: "ㇻㇼㇽㇾㇿ" },
				{ standard: "ワヰ_ヱヲ", voiced: "ヷヸ_ヹヺ", small: "ヮ____" },
				{ standard: "ン____" }
			];

			// Standalone glyphs that fall outside the gojūon grid: iteration marks
			// and punctuation. Combining marks are paired with a dotted circle
			// (◌, U+25CC) so they render in isolation, mirroring the README.
			const EXTRAS = [
			 "ヽ", "ヾ",
				"ー", "・", "゠", "゛", "゜", "◌゙", "◌゚", "◌"
			];

			// ---- Glyph availability detection ----
			// Render the character once with the font (falling back to monospace)
			// and once with monospace alone. If the pixels match, the font lacked
			// the glyph and the browser used the same fallback both times.
			const det = document.createElement("canvas");
			det.width = 60;
			det.height = 60;
			const dctx = det.getContext("2d", { willReadFrequently: true });
			function snapshot(ch, font) {
				dctx.clearRect(0, 0, 60, 60);
				dctx.fillStyle = "#000";
				dctx.textBaseline = "middle";
				dctx.textAlign = "center";
				dctx.font = "40px " + font;
				dctx.fillText(ch, 30, 30);
				return dctx.getImageData(0, 0, 60, 60).data;
			}
			const availCache = new Map();
			function isAvailable(ch) {
				if (ch === "_") return false;
				if (availCache.has(ch)) return availCache.get(ch);
				const ref = snapshot(ch, "monospace");
				const test = snapshot(ch, FONT + ", monospace");
				let diff = false;
				for (let i = 3; i < ref.length; i += 4) {
					if (ref[i] !== test[i]) { diff = true; break; }
				}
				availCache.set(ch, diff);
				return diff;
			}

			// Expand a chart into grid rows. Each row is five slots (char or null);
			// a missing or unavailable kana becomes null so the vowel columns stay
			// aligned. A variant row with no available glyph at all is skipped.
			function buildRows(groups) {
				const rows = [];
				groups.forEach((group) => {
					VARIANTS.forEach((variant) => {
						const source = group[variant];
						if (!source) return;
						const chars = Array.from(source);
						const slots = chars.map((ch) =>
							ch !== "_" && isAvailable(ch) ? ch : null
						);
						while (slots.length < 5) slots.push(null);
						if (slots.some((c) => c !== null)) rows.push(slots);
					});
				});
				return rows;
			}

			// Chunk the standalone extras into five-column rows, dropping any glyph
			// the font lacks and padding the final row with empty slots.
			function buildExtraRows(chars) {
				const available = chars.filter((ch) => isAvailable(ch));
				const rows = [];
				for (let i = 0; i < available.length; i += 5) {
					const slots = available.slice(i, i + 5);
					while (slots.length < 5) slots.push(null);
					rows.push(slots);
				}
				return rows;
			}

			let selectedChar = null;
			let hoverChar = null;
			function activeChar() {
				return hoverChar || selectedChar;
			}

			function renderGrid() {
				const rows = buildRows(HIRAGANA)
					.concat(buildRows(KATAKANA))
					.concat(buildExtraRows(EXTRAS));
				gridEl.textContent = "";
				let firstChar = null;
				rows.forEach((row) => {
					row.forEach((ch) => {
						if (ch === null) {
							const empty = document.createElement("div");
							empty.className = "glyph-cell glyph-cell--empty";
							empty.setAttribute("aria-hidden", "true");
							gridEl.appendChild(empty);
							return;
						}
						if (!firstChar) firstChar = ch;
						const btn = document.createElement("button");
						btn.type = "button";
						btn.className = "glyph-cell";
						btn.dataset.char = ch;
						btn.setAttribute("aria-pressed", "false");
						btn.setAttribute("aria-label", ch);
						const span = document.createElement("span");
						span.className = "glyph-cell__char";
						span.textContent = ch;
						btn.appendChild(span);
						gridEl.appendChild(btn);
					});
				});
				return firstChar;
			}

			function setSelected(ch) {
				selectedChar = ch;
				gridEl.querySelectorAll(".glyph-cell[data-char]").forEach((btn) => {
					btn.setAttribute("aria-pressed", String(btn.dataset.char === ch));
				});
				drawPreview();
			}

			// ---- Font metrics for the preview guide lines ----
			// Ratios are relative to font size, so they hold at any preview size.
			// Each metric is measured from a representative glyph at a reference
			// size: x-height from へ, cap height from エ, ascender from ん, and the
			// descender depth from り's bottom.
			let metrics = null;
			const METRIC_REF = 100;
			function computeMetrics() {
				const mctx = canvas.getContext("2d");
				mctx.font = METRIC_REF + "px " + FONT;
				const ascentOf = (ch) => mctx.measureText(ch).actualBoundingBoxAscent / METRIC_REF;
				const descentOf = (ch) => mctx.measureText(ch).actualBoundingBoxDescent / METRIC_REF;
				const safe = (value, fallback) =>
					isFinite(value) && value > 0 ? value : fallback;
				metrics = {
					xHeight: safe(ascentOf("へ"), 0.5),
					capHeight: safe(ascentOf("エ"), 0.7),
					ascent: safe(ascentOf("ん"), 0.88),
					descent: safe(descentOf("り"), 0.12)
				};
			}

			// Worst-case glyph extents (as ratios of font size) across every
			// available glyph. Sizing the preview to the largest glyph keeps the
			// font size and baseline constant for all glyphs, so the metric lines
			// never shift when switching between them, while nothing overflows.
			let extent = null;
			function computeExtent() {
				const mctx = canvas.getContext("2d");
				mctx.font = METRIC_REF + "px " + FONT;
				let maxAsc = metrics.ascent;
				let maxDesc = metrics.descent;
				let maxHalf = 0;
				const consider = (ch) => {
					if (!ch || ch === "_" || !isAvailable(ch)) return;
					const m = mctx.measureText(ch);
					const asc = (m.actualBoundingBoxAscent || 0) / METRIC_REF;
					const desc = (m.actualBoundingBoxDescent || 0) / METRIC_REF;
					const half =
						Math.max(m.actualBoundingBoxLeft || 0, m.actualBoundingBoxRight || 0) /
						METRIC_REF;
					if (asc > maxAsc) maxAsc = asc;
					if (desc > maxDesc) maxDesc = desc;
					if (half > maxHalf) maxHalf = half;
				};
				[HIRAGANA, KATAKANA].forEach((groups) =>
					groups.forEach((group) =>
						VARIANTS.forEach((variant) => {
							if (group[variant]) Array.from(group[variant]).forEach(consider);
						})
					)
				);
				EXTRAS.forEach(consider);
				extent = { maxAsc, maxDesc, maxHalf };
			}

			function drawPreview() {
				if (!metrics) computeMetrics();
				if (!extent) computeExtent();
				const cssSize = box.clientWidth;
				if (cssSize <= 0) return;
				const ctx = canvas.getContext("2d");
				const dpr = window.devicePixelRatio || 1;
				canvas.width = Math.round(cssSize * dpr);
				canvas.height = Math.round(cssSize * dpr);
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
				ctx.clearRect(0, 0, cssSize, cssSize);

				const color = getComputedStyle(document.body).color || "#000";
				const { ascent, descent, xHeight, capHeight } = metrics;

				const ch = activeChar();

				// One fixed font size for every glyph: the ~64% metric target, capped
				// so the tallest and widest glyph in the set still fit. Because it is
				// glyph-independent, the metric lines stay put when switching glyphs.
				const pad = 10;
				const avail = cssSize - 2 * pad;
				const fontSize = Math.min(
					(cssSize * 0.64) / (ascent + descent),
					avail / (extent.maxAsc + extent.maxDesc),
					extent.maxHalf > 0 ? avail / 2 / extent.maxHalf : Infinity
				);

				const aPx = ascent * fontSize;
				const dPx = descent * fontSize;
				const xPx = xHeight * fontSize;
				const cPx = capHeight * fontSize;

				// Fixed baseline that centres the worst-case glyph box vertically, so
				// the tallest ascender and deepest descender both stay inside.
				const baselineY =
					(cssSize - (extent.maxAsc + extent.maxDesc) * fontSize) / 2 +
					extent.maxAsc * fontSize;

				const x0 = 10;
				const x1 = cssSize - 10;
				const lines = [
					<!-- { y: baselineY - aPx, label: "ascender" }, -->
					{ y: baselineY - cPx, label: "cap height" },
					{ y: baselineY - xPx, label: "x-height" },
					{ y: baselineY, label: "baseline" },
					{ y: baselineY + dPx, label: "descender" }
				];

				ctx.strokeStyle = color;
				ctx.fillStyle = color;
				ctx.lineWidth = 1;
				ctx.font = "10px Inter, system-ui, sans-serif";
				ctx.textBaseline = "alphabetic";
				ctx.textAlign = "left";
				lines.forEach((ln) => {
					const y = Math.round(ln.y) + 0.5;
					ctx.globalAlpha = 0.2;
					ctx.beginPath();
					ctx.moveTo(x0, y);
					ctx.lineTo(x1, y);
					ctx.stroke();
					ctx.globalAlpha = 0.45;
					ctx.fillText(ln.label, x0, y - 3);
				});
				ctx.globalAlpha = 1;

				if (ch) {
					ctx.fillStyle = color;
					ctx.font = fontSize + "px " + FONT;
					ctx.textAlign = "center";
					ctx.textBaseline = "alphabetic";
					ctx.fillText(ch, cssSize / 2, baselineY);
				}
				label.textContent = ch || "";
			}

			// ---- Interaction: hover previews, click selects ----
			gridEl.addEventListener("mouseover", (e) => {
				const cell = e.target.closest(".glyph-cell[data-char]");
				if (!cell) return;
				hoverChar = cell.dataset.char;
				drawPreview();
			});
			gridEl.addEventListener("mouseleave", () => {
				hoverChar = null;
				drawPreview();
			});
			gridEl.addEventListener("focusin", (e) => {
				const cell = e.target.closest(".glyph-cell[data-char]");
				if (!cell) return;
				hoverChar = cell.dataset.char;
				drawPreview();
			});
			gridEl.addEventListener("focusout", () => {
				hoverChar = null;
				drawPreview();
			});
			gridEl.addEventListener("click", (e) => {
				const cell = e.target.closest(".glyph-cell[data-char]");
				if (!cell) return;
				setSelected(cell.dataset.char);
			});

			function start() {
				// Recompute against the loaded font: clear cached fallback results.
				availCache.clear();
				metrics = null;
				extent = null;
				const first = renderGrid();
				if (first) setSelected(first);
				else drawPreview();
			}

			if (document.fonts && document.fonts.ready) {
				// Explicitly request the font first: the page's body text uses Inter,
				// so nothing else triggers the kana font to load, and `fonts.ready`
				// could otherwise resolve before glyph detection has a font to read.
				const load = document.fonts
					.load('40px ' + FONT)
					.catch(() => {})
					.then(() => document.fonts.ready);
				load.then(start);
			} else {
				window.addEventListener("load", start);
			}
			if ("ResizeObserver" in window) {
				new ResizeObserver(() => drawPreview()).observe(box);
			} else {
				window.addEventListener("resize", drawPreview);
			}
		})();

		// ---- Tester ----
		// Drives the interactive specimen: the toolbar updates CSS custom
		// properties on the editable text, and the reference label below mirrors
		// the text content and alignment in a fixed, neutral rendering.
		(function () {
			"use strict";

			const section = document.querySelector(".tester");
			if (!section) return;

			const textEl = document.getElementById("testText");
			const labelEl = document.getElementById("testLabel");
			const sizeInput = document.getElementById("testSize");
			const lineHeightInput = document.getElementById("testLineHeight");
			const trackingInput = document.getElementById("testTracking");
			const alignToggle = document.getElementById("testAlignToggle");
			const fontToggle = document.getElementById("testFontToggle");
			const invertToggle = document.getElementById("testInvertToggle");
			const stage = document.getElementById("testStage");
			if (!textEl) return;

			// Font stacks selected by the Kanji font toggle. "full" falls back to
			// Inter + Gen Interface JP so non-kana characters still render; "tofu"
			// uses only Mìkam Kana then the embedded Tofu face, so anything Mìkam
			// Kana lacks shows as a missing-glyph box.
			const FONTS = {
				full: '"Mìkam Kana", InterVariable, "Gen Interface JP", system-ui, sans-serif',
				tofu: '"Mìkam Kana", Tofu'
			};

			function syncLabel() {
				labelEl.textContent = textEl.textContent;
			}

			// Single-select toggle helper: press the clicked button, release its
			// siblings, then run the callback with its dataset value.
			function wireSingleSelect(group, attr, onSelect) {
				group.addEventListener("click", (event) => {
					const btn = event.target.closest("button[data-" + attr + "]");
					if (!btn) return;
					group.querySelectorAll("button").forEach((b) => {
						b.setAttribute("aria-pressed", String(b === btn));
					});
					onSelect(btn.dataset[attr]);
				});
			}

			sizeInput.addEventListener("input", () => {
				textEl.style.setProperty("--size", sizeInput.value + "px");
			});
			lineHeightInput.addEventListener("input", () => {
				textEl.style.setProperty("--lh", lineHeightInput.value);
			});
			trackingInput.addEventListener("input", () => {
				textEl.style.setProperty("--tracking", trackingInput.value + "em");
			});

			// Alignment and font are inherited via custom properties on the
			// section, so both the editable text and the label stay in sync.
			wireSingleSelect(alignToggle, "align", (value) => {
				section.style.setProperty("--align", value);
			});
			wireSingleSelect(fontToggle, "font", (value) => {
				textEl.style.setProperty("--test-font", FONTS[value] || FONTS.full);
			});

			invertToggle.addEventListener("click", (event) => {
				const btn = event.target.closest("button[data-invert]");
				if (!btn) return;
				const pressed = btn.getAttribute("aria-pressed") === "true";
				btn.setAttribute("aria-pressed", String(!pressed));
				stage.classList.toggle("tester__stage--invert", !pressed);
			});

			textEl.addEventListener("input", syncLabel);

			// Initial state mirrors the markup defaults.
			textEl.style.setProperty("--size", sizeInput.value + "px");
			textEl.style.setProperty("--lh", lineHeightInput.value);
			textEl.style.setProperty("--tracking", trackingInput.value + "em");
			textEl.style.setProperty("--test-font", FONTS.full);
			section.style.setProperty("--align", "center");
			syncLabel();
		})();

		// ---- Slider value displays + resets ----
		// Wire every range slider to its live value display and optional reset
		// button. Formatting comes from data-decimals / data-unit on the input;
		// the default value for reset comes from data-default.
		(function () {
			"use strict";

			document.querySelectorAll(".ctl").forEach((ctl) => {
				const input = ctl.querySelector('input[type="range"]');
				if (!input) return;
				const output = ctl.querySelector(".ctl__value");
				const reset = ctl.querySelector(".ctl__reset");
				const decimals = parseInt(input.dataset.decimals || "0", 10);
				const unit = input.dataset.unit || "";

				const format = () => {
					if (!output) return;
					const value = decimals
						? parseFloat(input.value).toFixed(decimals)
						: input.value;
					output.textContent = value + unit;
				};

				input.addEventListener("input", format);

				if (reset) {
					reset.addEventListener("click", () => {
						if (input.dataset.default !== undefined) {
							input.value = input.dataset.default;
						}
						input.dispatchEvent(new Event("input", { bubbles: true }));
					});
				}

				format();
			});
		})();

		// ---- Auto-height reporting ----
		// An iframe is a replaced element, so the parent page cannot size it to
		// its content (CSS `height: fit-content`/`auto` have no effect, and a
		// cross-origin parent can't read this document at all). Instead we
		// measure our own content height and post it to the parent, which can
		// resize the iframe in response. See the README/embed snippet for the
		// matching parent-side listener.
		(function () {
			"use strict";

			function currentHeight() {
				// Measure the body's content box, not `documentElement`. Once the
				// parent sizes the iframe tall, the root element's height/scrollHeight
				// is floored at the (now tall) viewport, so it can never report a
				// smaller value when content shrinks. `body` has `margin:0`, so its
				// border-box height tracks content in both directions.
				return Math.ceil(document.body.getBoundingClientRect().height);
			}

			let lastHeight = 0;
			function report() {
				const height = currentHeight();
				if (height === lastHeight) return;
				lastHeight = height;
				// `*` target origin keeps the embed drop-in; the parent should
				// still verify `event.origin`/`event.source` before trusting it.
				window.parent.postMessage(
					{ type: "mikam-kana:embed-height", height },
					"*"
				);
			}

			// Report on load, when fonts settle, and whenever content reflows.
			window.addEventListener("load", report);
			if (document.fonts && document.fonts.ready) {
				document.fonts.ready.then(report);
			}
			if ("ResizeObserver" in window) {
				new ResizeObserver(report).observe(document.body);
			} else {
				window.addEventListener("resize", report);
			}
			// Allow the parent to request a height on demand.
			window.addEventListener("message", (event) => {
				if (event.data && event.data.type === "mikam-kana:request-height") {
					lastHeight = 0;
					report();
				}
			});
			report();
		})();
	</script>
</body>
</html>
